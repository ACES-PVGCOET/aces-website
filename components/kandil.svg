<svg viewBox="0 0 120 250" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- Multi-layered Ambient Diwali Night Glow -->
    <radialGradient id="kandilAmbientHalo" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#d946ef" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- Hanging suspension thread gradient -->
    <linearGradient id="kandilCordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="85%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Lime Green band gradient -->
    <linearGradient id="kandilGreenBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="25%" stop-color="#bef264" />
      <stop offset="75%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Dark Green backing for lattice cutouts -->
    <linearGradient id="kandilGreenBacking" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Hexagon Orange Border -->
    <linearGradient id="kandilOrangeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Magenta facet gradient -->
    <linearGradient id="kandilMagentaFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#9d174d" />
      <stop offset="30%" stop-color="#be185d" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <!-- Yellow glowing translucent facet gradient -->
    <radialGradient id="kandilYellowFacet" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Central internal bulb radiance -->
    <radialGradient id="kandilBulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#fb923c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Streamers Orange gradient (with upper glow) -->
    <linearGradient id="kandilStreamerOrange" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="12%" stop-color="#fed7aa" />
      <stop offset="28%" stop-color="#fb923c" />
      <stop offset="65%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Center Streamers Extra Bright gradient -->
    <linearGradient id="kandilStreamerCenter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="8%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Streamers Magenta (flanking sides) -->
    <linearGradient id="kandilStreamerMagenta" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="20%" stop-color="#db2777" />
      <stop offset="70%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Top-of-streamers core radiance -->
    <radialGradient id="kandilStreamerCoreGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- Reusable Floral Filigree Mandala Pattern (Yellow for Magenta panels) -->
    <g id="kandilYellowMandala">
      <circle cx="0" cy="0" r="3.2" fill="#fde047" stroke="#f59e0b" stroke-width="0.5" />
      <circle cx="0" cy="0" r="1.3" fill="#fffbeb" />
      <!-- 8 Petals radiating -->
      <path d="M0,-3.2 C-1.5,-6 1.5,-6 0,-3.2 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M0,3.2 C-1.5,6 1.5,6 0,3.2 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M-3.2,0 C-6,-1.5 -6,1.5 -3.2,0 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M3.2,0 C6,-1.5 6,1.5 3.2,0 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M-2.3,-2.3 C-4.2,-4.2 -2.8,-5.6 -1.6,-4.4 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M2.3,-2.3 C4.2,-4.2 2.8,-5.6 1.6,-4.4 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M-2.3,2.3 C-4.2,4.2 -2.8,5.6 -1.6,4.4 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <path d="M2.3,2.3 C4.2,4.2 2.8,5.6 1.6,4.4 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.35" />
      <!-- Surrounding filigree arabesque lace -->
      <path d="M0,-6.2 C-5,-9.5 -9,-5 -5.5,-1.2 C-3.2,1.2 -1,4.5 0,8 C1,4.5 3.2,1.2 5.5,-1.2 C9,-5 5,-9.5 0,-6.2 Z" fill="none" stroke="#fde047" stroke-width="0.75" />
      <circle cx="0" cy="-9.5" r="1.3" fill="#fef08a" />
      <circle cx="-8.2" cy="-2.2" r="1.1" fill="#fef08a" />
      <circle cx="8.2" cy="-2.2" r="1.1" fill="#fef08a" />
      <circle cx="-5.5" cy="5.5" r="1" fill="#fef08a" />
      <circle cx="5.5" cy="5.5" r="1" fill="#fef08a" />
      <path d="M-10,-3 C-12,-8 -6,-12 0,-12 C6,-12 12,-8 10,-3" fill="none" stroke="#fef08a" stroke-width="0.65" stroke-dasharray="1.2 0.8" />
    </g>

    <!-- Reusable Floral Filigree Mandala Pattern (Orange for Yellow panels) -->
    <g id="kandilOrangeMandala">
      <circle cx="0" cy="0" r="3.4" fill="#ea580c" />
      <circle cx="0" cy="0" r="1.6" fill="#fef08a" />
      <!-- Symmetrical 8-point lace rosette -->
      <path d="M0,-3.4 C-2,-7 2,-7 0,-3.4 Z" fill="#f97316" stroke="#c2410c" stroke-width="0.4" />
      <path d="M0,3.4 C-2,7 2,7 0,3.4 Z" fill="#f97316" stroke="#c2410c" stroke-width="0.4" />
      <path d="M-3.4,0 C-7,-2 -7,2 -3.4,0 Z" fill="#f97316" stroke="#c2410c" stroke-width="0.4" />
      <path d="M3.4,0 C7,-2 7,2 3.4,0 Z" fill="#f97316" stroke="#c2410c" stroke-width="0.4" />
      <path d="M-2.4,-2.4 C-4.8,-4.8 -3.2,-6.4 -1.9,-5.1 Z" fill="#fb923c" stroke="#c2410c" stroke-width="0.35" />
      <path d="M2.4,-2.4 C4.8,-4.8 3.2,-6.4 1.9,-5.1 Z" fill="#fb923c" stroke="#c2410c" stroke-width="0.35" />
      <path d="M-2.4,2.4 C-4.8,4.8 -3.2,6.4 -1.9,5.1 Z" fill="#fb923c" stroke="#c2410c" stroke-width="0.35" />
      <path d="M2.4,2.4 C4.8,4.8 3.2,6.4 1.9,5.1 Z" fill="#fb923c" stroke="#c2410c" stroke-width="0.35" />
      <!-- Outer arabesque lace -->
      <path d="M0,-7 C-5.5,-11 -11,-5.5 -6.5,-1.2 C-3.2,2.2 -1,6.5 0,11 C1,6.5 3.2,2.2 6.5,-1.2 C11,-5.5 5.5,-11 0,-7 Z" fill="none" stroke="#ea580c" stroke-width="0.85" />
      <circle cx="0" cy="-11.2" r="1.4" fill="#ea580c" />
      <circle cx="-10" cy="-2.8" r="1.2" fill="#ea580c" />
      <circle cx="10" cy="-2.8" r="1.2" fill="#ea580c" />
      <circle cx="-7" cy="7" r="1.1" fill="#ea580c" />
      <circle cx="7" cy="7" r="1.1" fill="#ea580c" />
      <!-- Scalloped lace outline -->
      <path d="M-12,-4 C-14.5,-10 -7.5,-15 0,-15 C7.5,-15 14.5,-10 12,-4 C14.5,1.5 10,8 0,14.5 C-10,8 -14.5,1.5 -12,-4 Z" fill="none" stroke="#c2410c" stroke-width="0.75" stroke-dasharray="1.6 1.1" />
    </g>
  </defs>

  <!-- 1. Ambient Background Halo for Night Glow -->
  <circle cx="60" cy="85" r="54" fill="url(#kandilAmbientHalo)" />
  <circle cx="60" cy="71" r="34" fill="url(#kandilAmbientHalo)" opacity="0.75" />

  <!-- 2. Hanging Thread & Loop -->
  <g class="kandil-suspension">
    <line x1="60" y1="0" x2="60" y2="22" stroke="url(#kandilCordGrad)" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="60" cy="5" r="1.8" fill="#fde047" stroke="#b45309" stroke-width="0.6" />
    <circle cx="60" cy="18" r="2.2" fill="#facc15" stroke="#dc2626" stroke-width="0.6" />
    <path d="M57 22 L63 22 L60 17 Z" fill="#e11d48" stroke="#fde047" stroke-width="0.5" />
  </g>

  <!-- 3. Streamers / Jhalar (Bottom Fringe) -->
  <!-- Layer A: Background Flanking Magenta Ribbons -->
  <g class="streamers-magenta" opacity="0.95">
    <rect x="34" y="120" width="4.5" height="96" rx="0.8" fill="url(#kandilStreamerMagenta)" />
    <rect x="37.5" y="120" width="4.5" height="106" rx="0.8" fill="url(#kandilStreamerMagenta)" />
    <rect x="78" y="120" width="4.5" height="106" rx="0.8" fill="url(#kandilStreamerMagenta)" />
    <rect x="81.5" y="120" width="4.5" height="96" rx="0.8" fill="url(#kandilStreamerMagenta)" />
  </g>

  <!-- Layer B: Foreground Vibrant Orange Ribbons (Paper Strips) -->
  <g class="streamers-orange">
    <!-- Strip 1 -->
    <rect x="38" y="120" width="4.2" height="108" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="40.1" y1="120" x2="40.1" y2="228" stroke="#fdba74" stroke-width="0.4" opacity="0.6" />

    <!-- Strip 2 -->
    <rect x="43" y="120" width="4.2" height="116" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="45.1" y1="120" x2="45.1" y2="236" stroke="#fed7aa" stroke-width="0.4" opacity="0.7" />

    <!-- Strip 3 -->
    <rect x="48" y="120" width="4.2" height="121" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="50.1" y1="120" x2="50.1" y2="241" stroke="#fef08a" stroke-width="0.5" opacity="0.8" />

    <!-- Strip 4 (Near Center) -->
    <rect x="53" y="120" width="4.4" height="125" rx="0.7" fill="url(#kandilStreamerCenter)" />
    <line x1="55.2" y1="120" x2="55.2" y2="245" stroke="#ffffff" stroke-width="0.5" opacity="0.85" />

    <!-- Strip 5 (Direct Center) -->
    <rect x="58" y="120" width="4.6" height="126" rx="0.7" fill="url(#kandilStreamerCenter)" />
    <line x1="60.3" y1="120" x2="60.3" y2="246" stroke="#ffffff" stroke-width="0.6" opacity="0.9" />

    <!-- Strip 6 (Near Center) -->
    <rect x="63.2" y="120" width="4.4" height="125" rx="0.7" fill="url(#kandilStreamerCenter)" />
    <line x1="65.4" y1="120" x2="65.4" y2="245" stroke="#ffffff" stroke-width="0.5" opacity="0.85" />

    <!-- Strip 7 -->
    <rect x="68.2" y="120" width="4.2" height="121" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="70.3" y1="120" x2="70.3" y2="241" stroke="#fef08a" stroke-width="0.5" opacity="0.8" />

    <!-- Strip 8 -->
    <rect x="73.2" y="120" width="4.2" height="116" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="75.3" y1="120" x2="75.3" y2="236" stroke="#fed7aa" stroke-width="0.4" opacity="0.7" />

    <!-- Strip 9 -->
    <rect x="78.2" y="120" width="4.2" height="108" rx="0.7" fill="url(#kandilStreamerOrange)" />
    <line x1="80.3" y1="120" x2="80.3" y2="228" stroke="#fdba74" stroke-width="0.4" opacity="0.6" />
  </g>

  <!-- Layer C: Luminous Core Light spilling down from within the streamers -->
  <ellipse cx="60" cy="132" rx="22" ry="16" fill="url(#kandilStreamerCoreGlow)" />
  <ellipse cx="60" cy="148" rx="14" ry="24" fill="url(#kandilStreamerCoreGlow)" opacity="0.7" />

  <!-- 4. Main Body: Outer Orange Scalloped Framework -->
  <g class="kandil-body-outer">
    <!-- Solid orange backing silhouette -->
    <polygon points="37,36 83,36 102,71 83,106 37,106 18,71" fill="#ea580c" />

    <!-- Outer Scallop Edges (Paper scallop trim) -->
    <!-- Top-Left diagonal -->
    <path d="M 18.0 71.0 Q 17.4 66.9, 21.2 65.2 Q 20.6 61.1, 24.3 59.3 Q 23.7 55.2, 27.5 53.5 Q 26.9 49.4, 30.7 47.7 Q 30.1 43.6, 33.8 41.8 Q 33.2 37.7, 37.0 36.0" 
      fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" />
    
    <!-- Top-Right diagonal -->
    <path d="M 83.0 36.0 Q 86.8 37.7, 86.2 41.8 Q 89.9 43.6, 89.3 47.7 Q 93.1 49.4, 92.5 53.5 Q 96.3 55.2, 95.7 59.3 Q 99.4 61.1, 98.8 65.2 Q 102.6 66.9, 102.0 71.0" 
      fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" />

    <!-- Bottom-Right diagonal -->
    <path d="M 102.0 71.0 Q 102.6 75.1, 98.8 76.8 Q 99.4 80.9, 95.7 82.7 Q 96.3 86.8, 92.5 88.5 Q 93.1 92.6, 89.3 94.3 Q 89.9 98.4, 86.2 100.2 Q 86.8 104.3, 83.0 106.0" 
      fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" />

    <!-- Bottom-Left diagonal -->
    <path d="M 37.0 106.0 Q 33.2 104.3, 33.8 100.2 Q 30.1 98.4, 30.7 94.3 Q 26.9 92.6, 27.5 88.5 Q 23.7 86.8, 24.3 82.7 Q 20.6 80.9, 21.2 76.8 Q 17.4 75.1, 18.0 71.0" 
      fill="none" stroke="#f97316" stroke-width="2.6" stroke-linecap="round" />

    <!-- Gold rim highlight -->
    <polygon points="37,36 83,36 102,71 83,106 37,106 18,71" fill="none" stroke="#fde047" stroke-width="0.8" opacity="0.85" />
  </g>

  <!-- 5. Internal Illuminated Facets -->
  <!-- Facet Left: Glowing Yellow Diamond -->
  <g class="facet-left">
    <polygon points="37,36 18,71 37,106 60,71" fill="url(#kandilYellowFacet)" stroke="#ea580c" stroke-width="1.2" stroke-linejoin="round" />
    <g transform="translate(38, 71) scale(1.15)">
      <use href="#kandilOrangeMandala" />
    </g>
  </g>

  <!-- Facet Right: Glowing Yellow Diamond -->
  <g class="facet-right">
    <polygon points="83,36 60,71 83,106 102,71" fill="url(#kandilYellowFacet)" stroke="#ea580c" stroke-width="1.2" stroke-linejoin="round" />
    <g transform="translate(82, 71) scale(1.15)">
      <use href="#kandilOrangeMandala" />
    </g>
  </g>

  <!-- Facet Top: Rich Magenta Inverted Triangle (V shape) -->
  <g class="facet-top">
    <polygon points="37,36 83,36 60,71" fill="url(#kandilMagentaFacet)" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="round" />
    <g transform="translate(60, 50) scale(1.05)">
      <use href="#kandilYellowMandala" />
    </g>
  </g>

  <!-- Facet Bottom: Rich Magenta Upright Triangle (^ shape) -->
  <g class="facet-bottom">
    <polygon points="37,106 83,106 60,71" fill="url(#kandilMagentaFacet)" stroke="#fbbf24" stroke-width="1.2" stroke-linejoin="round" />
    <g transform="translate(60, 92) scale(1.05) rotate(180)">
      <use href="#kandilYellowMandala" />
    </g>
  </g>

  <!-- Core bulb radiance at the center -->
  <circle cx="60" cy="71" r="15" fill="url(#kandilBulbGlow)" pointer-events="none" />
  <circle cx="60" cy="71" r="2.2" fill="#fffbeb" />

  <!-- 6. Top Lime-Green Lattice Crown (Y: 22 to 36) -->
  <g class="crown-top">
    <!-- Dark green backing -->
    <rect x="34" y="22" width="52" height="14" rx="1.5" fill="url(#kandilGreenBacking)" stroke="#4d7c0f" stroke-width="0.8" />
    
    <!-- Top Crenellated / Scalloped Edge -->
    <path d="M 34 22 
      C 36 19.5, 38 19.5, 40 22 C 42 19.5, 44 19.5, 46 22 
      C 48 19.5, 50 19.5, 52 22 C 54 19.5, 56 19.5, 58 22 
      C 60 19.5, 62 19.5, 64 22 C 66 19.5, 68 19.5, 70 22 
      C 72 19.5, 74 19.5, 76 22 C 78 19.5, 80 19.5, 82 22 
      C 84 19.5, 86 19.5, 86 22" 
      fill="none" stroke="#bef264" stroke-width="1.6" stroke-linecap="round" />

    <!-- Diamond Lattice Grid (Jali) in lime green -->
    <g stroke="#a3e635" stroke-width="1.1" stroke-linecap="round" opacity="0.95">
      <line x1="36" y1="36" x2="50" y2="22" />
      <line x1="43" y1="36" x2="57" y2="22" />
      <line x1="50" y1="36" x2="64" y2="22" />
      <line x1="57" y1="36" x2="71" y2="22" />
      <line x1="64" y1="36" x2="78" y2="22" />
      <line x1="71" y1="36" x2="85" y2="22" />
      <line x1="36" y1="22" x2="50" y2="36" />
      <line x1="43" y1="22" x2="57" y2="36" />
      <line x1="50" y1="22" x2="64" y2="36" />
      <line x1="57" y1="22" x2="71" y2="36" />
      <line x1="64" y1="22" x2="78" y2="36" />
      <line x1="71" y1="22" x2="85" y2="36" />
    </g>

    <!-- Lattice Diamond Center Dots -->
    <g fill="#bef264" opacity="0.85">
      <circle cx="43" cy="29" r="0.9" />
      <circle cx="50" cy="29" r="0.9" />
      <circle cx="57" cy="29" r="0.9" />
      <circle cx="64" cy="29" r="0.9" />
      <circle cx="71" cy="29" r="0.9" />
      <circle cx="78" cy="29" r="0.9" />
    </g>

    <!-- Top & Bottom Golden Borders of the band -->
    <line x1="34" y1="22" x2="86" y2="22" stroke="#bef264" stroke-width="1.3" />
    <line x1="34" y1="36" x2="86" y2="36" stroke="#84cc16" stroke-width="1.3" />

    <!-- Bottom Scalloped edge of top crown -->
    <path d="M 34 36 
      C 36 38, 38 38, 40 36 C 42 38, 44 38, 46 36 
      C 48 38, 50 38, 52 36 C 54 38, 56 38, 58 36 
      C 60 38, 62 38, 64 36 C 66 38, 68 38, 70 36 
      C 72 38, 74 38, 76 36 C 78 38, 80 38, 82 36 
      C 84 38, 86 38, 86 36" 
      fill="none" stroke="#a3e635" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- 7. Bottom Lime-Green Lattice Crown (Y: 106 to 120) -->
  <g class="crown-bottom">
    <rect x="34" y="106" width="52" height="14" rx="1.5" fill="url(#kandilGreenBacking)" stroke="#4d7c0f" stroke-width="0.8" />
    
    <!-- Top Scalloped rim of bottom crown -->
    <path d="M 34 106 
      C 36 104, 38 104, 40 106 C 42 104, 44 104, 46 106 
      C 48 104, 50 104, 52 106 C 54 104, 56 104, 58 106 
      C 60 104, 62 104, 64 106 C 66 104, 68 104, 70 106 
      C 72 104, 74 104, 76 106 C 78 104, 80 104, 82 106 
      C 84 104, 86 104, 86 106" 
      fill="none" stroke="#bef264" stroke-width="1.3" stroke-linecap="round" />

    <!-- Diamond Lattice Grid in lime green -->
    <g stroke="#a3e635" stroke-width="1.1" stroke-linecap="round" opacity="0.95">
      <line x1="36" y1="120" x2="50" y2="106" />
      <line x1="43" y1="120" x2="57" y2="106" />
      <line x1="50" y1="120" x2="64" y2="106" />
      <line x1="57" y1="120" x2="71" y2="106" />
      <line x1="64" y1="120" x2="78" y2="106" />
      <line x1="71" y1="120" x2="85" y2="106" />
      <line x1="36" y1="106" x2="50" y2="120" />
      <line x1="43" y1="106" x2="57" y2="120" />
      <line x1="50" y1="106" x2="64" y2="120" />
      <line x1="57" y1="106" x2="71" y2="120" />
      <line x1="64" y1="106" x2="78" y2="120" />
      <line x1="71" y1="106" x2="85" y2="120" />
    </g>

